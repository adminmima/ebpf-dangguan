name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-29
          components: rust-src, rustfmt, clippy
          # bpfel-unknown-none 是裸机 target，nightly 无预编译 rust-std。
          # eBPF 编译依赖 -Z build-std=core 从 rust-src 源码构建，不需要 targets。

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked --version 0.11.1

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (host)
        run: cargo clippy --workspace --exclude adblock-ebpf --all-targets -- -D warnings

      - name: clippy (ebpf)
        run: |
          cargo clippy -p adblock-ebpf --release --target bpfel-unknown-none \
            -Z build-std=core --target-dir target/ebpf-check -- -D warnings

      - name: build
        run: cargo build --release

      - name: test
        run: cargo test --workspace --exclude adblock-ebpf
